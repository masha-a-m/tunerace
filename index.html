 au.src=cur.p;au.load();
 const pr=au.play();
 if(pr&&pr.catch)pr.catch(e=>{if(e&&e.name==='NotAllowedError'&&cur===my&&!started&&$('qq')){clearTimeout(wd);
  $('qq').innerHTML='<button class="btn" id="tp" style="width:auto;padding:10px 22px">▶ Tap to play</button>';$('tp').onclick=()=>au.play()}})}
function pick(x,btn){if(done)return;done=true;clearInterval(tick);au.pause();$('eq').classList.add('off');
 const l=Math.max(0,LIM-(performance.now()-t0)/1000);
 [...$('ops').children].forEach(b=>{if(b._o===cur)b.classList.add('ok')});
 let m;const ok=x===cur;
 if(ok){streak++;mx=Math.max(mx,streak);const p=100+Math.round(l/LIM*150)+(streak>1?streak*10:0);me+=p;m='Correct  +'+p+(streak>1?'  ·  '+streak+' in a row 🔥':'')}
 else{streak=0;if(btn)btn.classList.add('bad');m=x?'Not quite':'Time’s up'}
 const [,pc]=MODES[mode],rc=Math.random()<pc,rt=2+Math.random()*(LIM*.65);
 if(rc){const p=100+Math.round((LIM-rt)/LIM*150);rv+=p;m+='  ·  Rival +'+p}else m+='  ·  Rival missed';
 $('fb').textContent=m;rec.push({t:cur.t,a:cur.a,ok});
 nt=setTimeout(()=>{r++;next()},2300)}
function finish(){const w=me>rv,t=me===rv,k='tr_best_'+cat,pb=+ls.get(k)||0,nb=me>pb;if(nb)ls.set(k,me);
 const hits=rec.filter(x=>x.ok).length;addStats(w,hits);
 view(`<div class="res"><div class="hero"><div class="mark">${w?'♛':t?'＝':'♪'}</div></div>
 <h1>${w?'You win':t?'It’s a tie':'Rival wins'}</h1><p class="tag">${hits}/${ROUNDS} songs named · ${esc(cat)} · ${mode}${nb?' · New best!':''}</p>
 <div class="vs"><div class="${w?'w':''}"><b>${me}</b><span>${esc(nm().slice(0,10))}</span></div><div class="${!w&&!t?'w':''}"><b>${rv}</b><span>Rival</span></div></div>
 <button class="btn" id="ag">Play again</button><div style="height:10px"></div><button class="btn g" id="hm">Choose another section</button>
 <h2 style="text-align:left;margin-top:22px"><span>Recap</span>This round’s songs</h2>
 <div class="rec">${rec.map(x=>`<div><em>${x.ok?'✅':'❌'}</em><span>${esc(x.t)}<small>${esc(x.a)}</small></span></div>`).join('')}</div></div>`);
 $('ag').onclick=()=>load(cat);$('hm').onclick=()=>home()}
ls.get('tr_name')?home():askName(1);
