<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<title>Tune Race</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b10;--sf:#14141c;--sf2:#1b1b26;--ln:#2a2a36;--gold:#d4af6a;--tx:#f2efe8;--mu:#8d8a96;--ok:#4ade80;--bad:#f87171;color-scheme:dark;
--serif:"Playfair Display",Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans)}
body{background:radial-gradient(900px 500px at 50% -10%,#2a1f0c 0%,transparent 60%),var(--bg);min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 18px max(32px,env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column;gap:18px}
.hero{text-align:center;padding:18px 0 4px}
.mark{width:54px;height:54px;margin:0 auto 12px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);font-size:24px}
h1{font-family:var(--serif);font-size:44px;margin:0;letter-spacing:.5px;font-weight:700}h1 em{color:var(--gold);font-style:italic}
.tag{color:var(--mu);margin:8px 0 0;font-size:15px}
h2{font-family:var(--serif);font-size:20px;margin:6px 0 10px;font-weight:600}
h2 span{display:block;font-family:var(--sans);font-size:12px;color:var(--mu);font-weight:500;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:2px}
.chips{display:flex;gap:8px;justify-content:center}
.chip{flex:1;padding:11px 6px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--mu);font:600 13px var(--sans);text-align:center}
.chip small{display:block;font-weight:500;opacity:.8;margin-top:2px}
.chip.on{border-color:var(--gold);color:var(--gold);background:#1d1810}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{position:relative;overflow:hidden;text-align:left;border:1px solid var(--ln);border-radius:16px;padding:16px 14px;min-height:104px;color:var(--tx);font-family:var(--sans);display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer}
.card b{font-family:var(--serif);font-size:18px;font-weight:600}.card small{color:#ffffffa8;font-size:12px;margin-top:3px;line-height:1.3}
.card i{position:absolute;top:10px;right:12px;font-style:normal;font-size:11px;color:var(--gold);font-weight:600}
.card:active,.btn:active,.opt:active{transform:scale(.98)}
.feat{grid-column:1/-1;min-height:92px;border-color:#5a4720}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.x{width:38px;height:38px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);color:var(--mu);font-size:16px}
.sc{display:flex;gap:14px;font-weight:700;font-size:15px}.sc span{color:var(--mu);font-weight:500;font-size:12px;display:block;letter-spacing:1px;text-transform:uppercase}
.sc div:last-child{text-align:right}
.seg{display:flex;gap:4px}.seg i{flex:1;height:3px;border-radius:2px;background:var(--ln)}.seg i.d{background:var(--gold)}.seg i.n{background:#7a6334}
.stage{text-align:center;padding:6px 0}
.ring{position:relative;width:112px;height:112px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:5}
.ring .b{stroke:var(--ln)}.ring .f{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .1s linear}
.ring div{position:absolute;inset:0;display:grid;place-items:center;font:700 34px var(--serif)}
.eq{display:flex;gap:4px;justify-content:center;align-items:flex-end;height:26px;margin:14px 0 6px}
.eq i{width:4px;background:var(--gold);border-radius:2px;animation:b .7s infinite ease-in-out alternate}
.eq i:nth-child(2n){animation-delay:.2s}.eq i:nth-child(3n){animation-delay:.4s}.eq i:nth-child(5n){animation-delay:.1s}
.eq.off i{animation:none;height:4px}
@keyframes b{from{height:4px}to{height:26px}}
.q{color:var(--mu);font-size:14px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;min-height:62px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:600 16px var(--sans)}
.opt u{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--ln);display:grid;place-items:center;font:600 12px var(--sans);color:var(--mu);text-decoration:none}
.opt small{display:block;color:var(--mu);font-weight:500;font-size:13px;margin-top:1px}
.opt.ok{background:#12301f;border-color:var(--ok)}.opt.ok u{background:var(--ok);color:#06210f;border-color:var(--ok)}
.opt.bad{background:#341616;border-color:var(--bad)}.opt.bad u{background:var(--bad);color:#2a0909;border-color:var(--bad)}
.fb{min-height:40px;text-align:center;font-weight:600;font-size:14px;color:var(--gold)}
.btn{width:100%;padding:15px;border-radius:14px;border:1px solid var(--gold);background:var(--gold);color:#1a1405;font:700 16px var(--sans)}
.btn.g{background:transparent;color:var(--gold)}
.res{text-align:center}.res h1{font-size:36px;margin:8px 0}
.vs{display:flex;gap:10px;margin:16px 0}.vs div{flex:1;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px}
.vs b{display:block;font:700 32px var(--serif)}.vs span{font-size:12px;color:var(--mu);letter-spacing:1px;text-transform:uppercase}
.vs .w{border-color:var(--gold)}
.rec{text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.rec div{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--ln);font-size:14px}.rec div:last-child{border:0}
.rec em{font-style:normal;flex:none}.rec small{color:var(--mu);display:block}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--ln);border-top-color:var(--gold);margin:30px auto 14px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
footer{margin-top:auto;text-align:center;font-size:11px;color:var(--mu);padding-top:10px}
</style></head><body>
<div id="app"></div>
<script>
const G=[
{g:'Naija & Africa',s:'Home sound',items:[
 {k:'Afrobeats',e:'🔥',c:'#3a2606',a:['Burna Boy','Wizkid','Davido','Tems','Rema','Asake','Ayra Starr','Fireboy DML','Omah Lay','Kizz Daniel']},
 {k:'Naija Classics',e:'🇳🇬',c:'#0d2e1c',a:['2Baba','P-Square','D’banj','Flavour','Timaya','Wande Coal','Banky W','Olamide']},
 {k:'Amapiano & SA',e:'🥁',c:'#2b1236',a:['Tyla','Kabza De Small','DJ Maphorisa','Uncle Waffles','Major League DJz','Focalistic','Black Coffee','Musa Keys']},
 {k:'Hausa',e:'🌅',c:'#2e2410',a:['Ali Jita','Rarara','Classiq','Morell','Umar M Shariff','Hamisu Breaker','Nura M Inuwa','Garzali Miko','Adam A Zango','Mansura Isah']}]},
{g:'Worldwide',s:'Global hits',items:[
 {k:'Pop',e:'✨',c:'#38122a',a:['Dua Lipa','Ed Sheeran','The Weeknd','Ariana Grande','Bruno Mars','Rihanna','Adele','Billie Eilish']},
 {k:'Hip-Hop',e:'🎤',c:'#2a2410',a:['Drake','Kendrick Lamar','Eminem','Nicki Minaj','Travis Scott','Cardi B','Jay-Z','Kanye West']},
 {k:'R&B',e:'🌙',c:'#1c1a3a',a:['Beyoncé','Usher','Alicia Keys','SZA','Chris Brown','Mary J. Blige','Summer Walker','Brent Faiyaz']},
 {k:'Rock',e:'🎸',c:'#2e1212',a:['Queen','Coldplay','Imagine Dragons','Linkin Park','Nirvana','Metallica','AC/DC','Foo Fighters']},
 {k:'Latin',e:'💃',c:'#3a1b0b',a:['Bad Bunny','Shakira','J Balvin','Karol G','Daddy Yankee','Ozuna','Maluma','Rosalía']},
 {k:'Throwbacks',e:'📼',c:'#14303a',a:['Michael Jackson','Whitney Houston','Backstreet Boys','Britney Spears','Destiny’s Child','Celine Dion','Mariah Carey','Boyz II Men']}]}];
const ALL=G.flatMap(x=>x.items),MODES={Relaxed:[20,.5],Classic:[15,.65],Blitz:[8,.8]},ROUNDS=10;
const au=new Audio(),cache={},$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let mode=ls.get('tr_mode')||'Classic',cat,pool,r,me,rv,cur,done,t0,tick,nt,rec,streak,LIM;
const root=document.getElementById('app');
const view=h=>{root.innerHTML=h+'<footer>Music previews provided by Deezer</footer>'};
function jsonp(u){return new Promise((res,rej)=>{const cb='cb'+Math.random().toString(36).slice(2),s=document.createElement('script');
 const end=()=>{s.remove();delete window[cb]};window[cb]=d=>{end();res(d)};s.onerror=()=>{end();rej()};
 s.src=u+'&output=jsonp&callback='+cb;document.head.appendChild(s);setTimeout(()=>{end();rej()},9000)})}
const api=u=>fetch(u).then(r=>{if(!r.ok)throw 0;return r.json()}).catch(()=>jsonp(u));
function home(msg){au.pause();clearInterval(tick);clearTimeout(nt);
 let h=`<div class="hero"><div class="mark">♪</div><h1>Tune<em>Race</em></h1><p class="tag">Name the song. Beat the clock. Outrun your rival.</p></div>
 ${msg?`<p class="fb" style="color:var(--bad)">${esc(msg)}</p>`:''}
 <div class="chips">${Object.keys(MODES).map(m=>`<button class="chip ${m===mode?'on':''}" data-m="${m}">${m}<small>${MODES[m][0]}s per song</small></button>`).join('')}</div>
 <div class="grid"><button class="card feat" data-k="Mix" style="background:linear-gradient(120deg,#4a3410,#14141c)"><b>Mix It Up</b><small>Random artists from every section</small><i>${ls.get('tr_best_Mix')?'BEST '+ls.get('tr_best_Mix'):'★'}</i></button></div>`;
 G.forEach(s=>{h+=`<div><h2><span>${esc(s.s)}</span>${esc(s.g)}</h2><div class="grid">${s.items.map(c=>{const b=ls.get('tr_best_'+c.k);
  return `<button class="card" data-k="${esc(c.k)}" style="background:linear-gradient(160deg,${c.c},#101018)"><i>${b?'BEST '+b:c.e}</i><b>${esc(c.k)}</b><small>${esc(c.a.slice(0,3).join(', '))}…</small></button>`}).join('')}</div></div>`});
 view(h);
 root.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{mode=b.dataset.m;ls.set('tr_mode',mode);home(msg)});
 root.querySelectorAll('.card').forEach(b=>b.onclick=()=>load(b.dataset.k))}
async function load(k){cat=k;
 au.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=';au.play().then(()=>au.pause()).catch(()=>{});
 view(`<div class="hero"><div class="spin"></div><h2 style="text-align:center">Finding songs…</h2><p class="tag">${esc(k)}</p></div>`);
 try{
  if(!cache[k]){
   const names=k==='Mix'?sh(ALL.flatMap(c=>c.a)).slice(0,14):ALL.find(c=>c.k===k).a;
   const rs=await Promise.allSettled(names.map(a=>api('https://api.deezer.com/search?limit=25&q='+encodeURIComponent(a))));
   const ok=rs.filter(x=>x.status==='fulfilled').length;if(!ok)throw new Error('NET');
   const p=[],seen=new Set();
   rs.forEach((x,i)=>{if(x.status!=='fulfilled')return;const n=names[i].toLowerCase();
    (x.value.data||[]).forEach(t=>{if(!t.preview||!t.artist)return;const an=t.artist.name.toLowerCase();
     if(!(an.includes(n)||n.includes(an)))return;const key=(t.title_short||t.title).toLowerCase();
     if(seen.has(key))return;seen.add(key);p.push({t:t.title_short||t.title,a:t.artist.name,p:t.preview})})});
   if(p.length<12)throw new Error('FEW');cache[k]=p}
  pool=cache[k];r=0;me=0;rv=0;rec=[];streak=0;LIM=MODES[mode][0];next()
 }catch(e){home(e.message==='NET'?'Couldn’t reach Deezer. Check your connection and try again.':'Not enough playable songs found here. Try another section.')}}
function next(){
 if(r>=ROUNDS)return finish();
 cur=pool[Math.floor(Math.random()*pool.length)];done=false;
 const o=sh([cur,...sh(pool.filter(x=>x.t!==cur.t&&x.a!==cur.a)).slice(0,3)]);
 view(`<div class="top"><button class="x" id="qt">✕</button><div class="sc"><div><span>You</span>${me}</div><div><span>Rival</span>${rv}</div></div></div>
 <div class="seg">${Array.from({length:ROUNDS},(_,i)=>`<i class="${i<r?(rec[i]&&rec[i].ok?'d':'n'):''}"></i>`).join('')}</div>
 <div class="stage"><div class="ring"><svg width="112" height="112" viewBox="0 0 112 112"><circle class="b" cx="56" cy="56" r="50"/><circle class="f" id="rg" cx="56" cy="56" r="50" stroke-dasharray="314.16" stroke-dashoffset="0"/></svg><div id="tm">${LIM}</div></div>
 <div class="eq" id="eq">${'<i></i>'.repeat(14)}</div><div class="q">Which song is playing?</div></div>
 <div class="opts" id="ops"></div><div class="fb" id="fb"></div>`);
 o.forEach((x,i)=>{const b=document.createElement('button');b.className='opt';b._o=x;
  b.innerHTML=`<u>${'ABCD'[i]}</u><span>${esc(x.t)}<small>${esc(x.a)}</small></span>`;b.onclick=()=>pick(x,b);$('ops').appendChild(b)});
 $('qt').onclick=()=>{if(confirm('Quit this game?'))home()};
 au.src=cur.p;au.play().catch(()=>{$('fb').textContent='Tap an answer when you’re ready — audio may need a tap'});
 t0=performance.now();clearInterval(tick);
 tick=setInterval(()=>{const l=Math.max(0,LIM-(performance.now()-t0)/1000);$('tm').textContent=Math.ceil(l);
  $('rg').style.strokeDashoffset=314.16*(1-l/LIM);if(l<=0)pick(null)},100)}
function pick(x,btn){if(done)return;done=true;clearInterval(tick);au.pause();$('eq').classList.add('off');
 const l=Math.max(0,LIM-(performance.now()-t0)/1000);
 [...$('ops').children].forEach(b=>{if(b._o===cur)b.classList.add('ok')});
 let m;const ok=x===cur;
 if(ok){streak++;const p=100+Math.round(l/LIM*150)+(streak>1?streak*10:0);me+=p;m='Correct  +'+p+(streak>1?'  ·  '+streak+' in a row 🔥':'')}
 else{streak=0;if(btn)btn.classList.add('bad');m=x?'Not quite':'Time’s up'}
 const [,pc]=MODES[mode],rc=Math.random()<pc,rt=2+Math.random()*(LIM*.65);
 if(rc){const p=100+Math.round((LIM-rt)/LIM*150);rv+=p;m+='  ·  Rival +'+p}else m+='  ·  Rival missed';
 $('fb').textContent=m;rec.push({t:cur.t,a:cur.a,ok});
 nt=setTimeout(()=>{r++;next()},2300)}
function finish(){const w=me>rv,t=me===rv,k='tr_best_'+cat,pb=+ls.get(k)||0,nb=me>pb;if(nb)ls.set(k,me);
 const hits=rec.filter(x=>x.ok).length;
 view(`<div class="res"><div class="hero"><div class="mark">${w?'♛':t?'＝':'♪'}</div></div>
 <h1>${w?'You win':t?'It’s a tie':'Rival wins'}</h1><p class="tag">${hits}/${ROUNDS} songs named · ${esc(cat)} · ${mode}${nb?' · New best!':''}</p>
 <div class="vs"><div class="${w?'w':''}"><b>${me}</b><span>You</span></div><div class="${!w&&!t?'w':''}"><b>${rv}</b><span>Rival</span></div></div>
 <button class="btn" id="ag">Play again</button><div style="height:10px"></div><button class="btn g" id="hm">Choose another section</button>
 <h2 style="text-align:left;margin-top:22px"><span>Recap</span>This round’s songs</h2>
 <div class="rec">${rec.map(x=>`<div><em>${x.ok?'✅':'❌'}</em><span>${esc(x.t)}<small>${esc(x.a)}</small></span></div>`).join('')}</div></div>`);
 $('ag').onclick=()=>load(cat);$('hm').onclick=()=>home()}
home();
</script></body></html>
